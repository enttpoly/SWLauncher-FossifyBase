name: Build SW Launcher Fossify Base APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Fossify Base Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Permissão no Gradle
        run: chmod +x ./gradlew

      - name: Gerar APK fossDebug
        run: ./gradlew --no-daemon :app:assembleFossDebug

      - name: Mostrar APKs encontrados
        run: |
          echo "APKs encontrados:"
          find . -type f -name "*.apk" -print
          echo "Pastas build/outputs:"
          find . -path "*build/outputs*" -maxdepth 8 -type f | head -200

      - name: Copiar APK para pasta de artifact
        run: |
          rm -rf apk-out
          mkdir -p apk-out
          find . -type f -name "*.apk" -exec cp {} apk-out/ \;
          ls -lah apk-out
          test "$(find apk-out -type f -name '*.apk' | wc -l)" -gt 0

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: swlauncher-fossify-base-apk
          path: apk-out/*.apk
          if-no-files-found: error
